apply plugin: 'com.android.library'

android {
    namespace "org.opencv"
    compileSdk 29
    buildToolsVersion "29.0.2"

    buildFeatures {
        aidl true
    }

    defaultConfig {
        minSdk 21
        targetSdk 29
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
}
